name: Validate static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser scripts
        run: |
          node --check script.js
          node --check scripts/update-changelog.mjs
          node --check examples/task-workshop/server.js
      - name: Run workshop reference tests
        run: npm test --prefix examples/task-workshop
      - name: Validate HTML structure
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; for (const file of ['index.html','workshop.html']) { const html = await readFile(file, 'utf8'); if (!html.includes('<main') || !html.includes('</html>')) throw new Error(file + ' has incomplete document structure'); }"
      - name: Verify changelog data shape
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const allowed = new Set(['Improvement','Release']); const data = JSON.parse(await readFile('data/changelog.json', 'utf8')); if (!data.updatedAt || !Array.isArray(data.items) || !data.items.length || !data.items.every(({ title, url, date, type, summary }) => title && url && date && allowed.has(type) && summary)) throw new Error('Invalid changelog data');"
